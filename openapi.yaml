openapi: 3.1.0
info:
  title: BrollForge API
  description: Enterprise Script and Voiceover to B-roll Video Engine (IncuBrix Engineering
    Assessment 3)
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - System
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      tags:
      - System
      summary: Readiness Check
      operationId: readiness_check_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/providers:
    get:
      tags:
      - Providers
      summary: List Providers
      operationId: list_providers_api_v1_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/config:
    get:
      tags:
      - Configuration
      summary: Get System Config
      operationId: get_system_config_api_v1_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/storage/{file_path}:
    get:
      tags:
      - Storage
      summary: Serve Storage File
      operationId: serve_storage_file_api_v1_storage__file_path__get
      parameters:
      - name: file_path
        in: path
        required: true
        schema:
          type: string
          title: File Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/broll/jobs:
    post:
      summary: Create a new B-roll video generation job
      operationId: create_broll_job_api_v1_broll_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/broll/jobs/upload:
    post:
      summary: Upload an audio voiceover file (MP3, WAV, M4A) and create a job
      operationId: upload_audio_job_api_v1_broll_jobs_upload_post
      parameters:
      - name: aspect_ratios
        in: query
        required: false
        schema:
          type: string
          default: '["16:9", "9:16"]'
          title: Aspect Ratios
      - name: style
        in: query
        required: false
        schema:
          type: string
          default: bright, modern, real-world footage
          title: Style
      - name: avoid
        in: query
        required: false
        schema:
          type: string
          default: '["people''s faces", "alcohol"]'
          title: Avoid
      - name: burn_captions
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Burn Captions
      - name: callback_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_audio_job_api_v1_broll_jobs_upload_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      summary: Get job status and progress
      operationId: get_job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs:
    get:
      summary: List recent jobs
      operationId: list_jobs_api_v1_jobs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/timeline:
    get:
      summary: Get job scene timeline breakdown
      operationId: get_job_timeline_api_v1_jobs__job_id__timeline_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/manifest:
    get:
      summary: Get full job manifest artifact
      operationId: get_job_manifest_api_v1_jobs__job_id__manifest_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/captions:
    get:
      summary: Download captions SRT file
      operationId: get_job_captions_api_v1_jobs__job_id__captions_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/results:
    get:
      summary: Get finished video results and download URLs
      operationId: get_job_results_api_v1_jobs__job_id__results_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/scenes/{scene_id}/swap:
    post:
      summary: Swap scene clip and rerender affected video segment
      operationId: swap_scene_api_v1_jobs__job_id__scenes__scene_id__swap_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: scene_id
        in: path
        required: true
        schema:
          type: string
          title: Scene Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneSwapRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      tags:
      - Root
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    Body_upload_audio_job_api_v1_broll_jobs_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_audio_job_api_v1_broll_jobs_upload_post
    CaptionsConfig:
      properties:
        burn_in:
          type: boolean
          title: Burn In
          default: true
        srt:
          type: boolean
          title: Srt
          default: true
      type: object
      title: CaptionsConfig
    CreateJobRequest:
      properties:
        audio_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Url
        script:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
          title: Script
        scenes:
          anyOf:
          - items:
              $ref: '#/components/schemas/SceneInput'
            type: array
          - type: 'null'
          title: Scenes
        voice:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice
          default: en-IN-female
        aspect_ratios:
          items:
            type: string
          type: array
          title: Aspect Ratios
        style:
          type: string
          title: Style
          default: bright, modern, real-world footage
        avoid:
          items:
            type: string
          type: array
          title: Avoid
        captions:
          $ref: '#/components/schemas/CaptionsConfig'
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      title: CreateJobRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        progress:
          type: integer
          title: Progress
        stage:
          type: string
          title: Stage
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        result_links:
          additionalProperties: true
          type: object
          title: Result Links
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        error:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Error
      type: object
      required:
      - job_id
      - status
      - progress
      - stage
      - created_at
      - updated_at
      title: JobResponse
    SceneInput:
      properties:
        text:
          type: string
          maxLength: 1000
          minLength: 1
          title: Text
        visual_hint:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Visual Hint
      type: object
      required:
      - text
      title: SceneInput
    SceneSwapRequest:
      properties:
        clip_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Clip Id
        visual_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Visual Hint
      type: object
      title: SceneSwapRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
