version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: brollforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brolluser
      POSTGRES_PASSWORD: brollpass
      POSTGRES_DB: brolldb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brolluser -d brolldb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brollforge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: brollforge_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: brollforge_api
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://brolluser:brollpass@postgres:5432/brolldb
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=brollforge-artifacts
      - LOCAL_STORAGE_PATH=/app/storage
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: brollforge_worker
    restart: unless-stopped
    command: ["python", "-m", "rq", "worker", "-u", "redis://redis:6379/0", "broll_render_queue"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://brolluser:brollpass@postgres:5432/brolldb
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=brollforge-artifacts
      - LOCAL_STORAGE_PATH=/app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brollforge_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
